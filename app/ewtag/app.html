<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>eWtag</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../common.css">

    <style>
        body {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-group {
            background: var(--color-surface);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .group-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--color-primary);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 12px;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--color-on-surface);
            font-size: 16px;
        }

        .setting-label i {
            width: 24px;
            color: var(--color-primary);
        }

        .setting-label small {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-left: 8px;
        }

        .checkbox {
            width: 52px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox.active {
            background: var(--color-primary);
        }

        .checkbox::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 12px;
            top: 2px;
            left: 2px;
            transition: all 0.2s;
        }

        .checkbox.active::after {
            left: 26px;
        }

        .key-input {
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-on-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            font-family: 'Roboto Mono', Consolas, monospace;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--color-primary);
            outline: none;
        }

        .actions-bar {
            position: sticky;
            bottom: 0;
            background: var(--color-background);
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .setting-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .key-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <i class="fas fa-tag"></i>
                <span id="statusText">eWtag</span>
            </h1>
        </header>

        <div class="settings-group">
            <div class="group-title"><i class="fas fa-toggle-on"></i> <span id="tagsTitle">Tags</span></div>
            <div class="setting-item">
                <span class="setting-label"><i class="fab fa-apple"></i> <span id="iTagLabel">iTag</span> <small id="iTagHint">Apple Find My</small></span>
                <div id="iTagToggle" class="checkbox"></div>
            </div>
            <div class="setting-item">
                <span class="setting-label"><i class="fab fa-google"></i> <span id="gTagLabel">gTag</span> <small id="gTagHint">Google Find My</small></span>
                <div id="gTagToggle" class="checkbox"></div>
            </div>
            <div class="setting-item">
                <span class="setting-label"><i class="fas fa-tag"></i> <span id="eTagLabel">eTag</span> <small id="eTagHint">eucWatch tag</small></span>
                <div id="eTagToggle" class="checkbox"></div>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-title"><i class="fas fa-key"></i> <span id="keysTitle">Keys</span></div>
            <div class="setting-item">
                <span class="setting-label"><i class="fas fa-key"></i> <span id="iKeyLabel">iKey</span> <small id="iKeyHint">base64 · 28 bytes</small></span>
                <div class="key-input"><input type="text" id="iKeyInput" placeholder="base64 key" spellcheck="false" autocomplete="off"></div>
            </div>
            <div class="setting-item">
                <span class="setting-label"><i class="fas fa-key"></i> <span id="gKeyLabel">gKey</span> <small id="gKeyHint">hex · 20 bytes</small></span>
                <div class="key-input"><input type="text" id="gKeyInput" placeholder="hex key" spellcheck="false" autocomplete="off"></div>
            </div>
        </div>

        <div class="actions-bar">
            <button class="btn btn-outline" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> <span id="refreshText">Refresh</span>
            </button>
            <button class="btn btn-outline" id="saveBtn">
                <i class="fas fa-save"></i> <span id="saveText">Save</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
